<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CodeArena — aprende C++ peleando batallas de código / learn C++ fighting code battles">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CodeArena">
  <meta name="theme-color" content="#0E1420">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>CodeArena</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; padding: 0; background: #0E1420; height: 100%; }
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 18px;
      background: radial-gradient(circle at 50% 35%, #1B2740 0%, #0E1420 70%);
      font-family: system-ui, sans-serif;
      transition: opacity .45s ease;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash .sword {
      font-size: 64px; animation: pulse 1.1s ease-in-out infinite;
      filter: drop-shadow(0 0 24px rgba(76,194,255,.55));
    }
    #splash .title {
      color: #F1F5FF; font-size: 34px; font-weight: 900;
      letter-spacing: 1px;
    }
    #splash .title em { color: #4CC2FF; font-style: normal; }
    #splash .tag {
      color: #9AA7C7; font-size: 14px;
    }
    #splash .bar {
      width: 210px; height: 6px; border-radius: 3px;
      background: #1B2740; overflow: hidden;
    }
    #splash .bar i {
      display: block; height: 100%; width: 40%;
      border-radius: 3px; background: linear-gradient(90deg,#4CC2FF,#FFC94D);
      animation: slide 1.2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.12) } }
    @keyframes slide { 0% { margin-left: -40% } 100% { margin-left: 100% } }
  </style>
</head>
<body>
  <div id="splash">
    <div class="sword">⚔️</div>
    <div class="title">Code<em>Arena</em></div>
    <div class="tag">Aprende C++ peleando batallas de código</div>
    <div class="bar"><i></i></div>
  </div>
  <script>
    {{flutter_js}}
    {{flutter_build_config}}
    {{flutter_service_worker_version}}

    window.addEventListener('load', function () {
      var splash = document.getElementById('splash');
      _flutter.loader.load({
        onEntrypointLoaded: async function (engineInitializer) {
          var appRunner = await engineInitializer.initializeEngine();
          await appRunner.runApp();
          // first frame is up — fade the splash out
          splash.classList.add('hide');
          setTimeout(function () { splash.remove(); }, 500);
        }
      });
    });
  </script>
</body>
</html>
